[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerpulse-worker"
version = "0.1.0"
description = "LedgerPulse background workers (Celery)"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.4",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "boto3>=1.35",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pillow>=11.0",
    "imagehash>=4.3",
    "rapidfuzz>=3.10",
    "anthropic>=0.40",
    "pgvector>=0.3.6",
]

[tool.setuptools]
packages = ["worker"]
