[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerpulse-mock-erp"
version = "0.1.0"
description = "Mock accounting system of record (export + payment endpoints)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[tool.setuptools]
py-modules = ["main"]
